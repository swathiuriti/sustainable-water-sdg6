
{% extends 'base.html' %}

{% block content %}

<h2 class="mb-4">
Chlorination Calculator
</h2>

<div class="card shadow p-4">

<label>
Water Quantity (Litres)
</label>

<input
type="number"
id="litres"
class="form-control"
placeholder="Enter litres">

<br>

<button
class="btn btn-primary"
onclick="calculateChlorine()">

Calculate

</button>

</div>

<div
id="resultCard"
class="card shadow p-4 mt-4"
style="display:none;">

<h3 id="chlorineAmount"></h3>

<h4 id="waitingTime"></h4>

<div id="instructions"></div>

</div>

<script>

function calculateChlorine(){

let litres =

parseFloat(
document.getElementById(
"litres"
).value
);

if(
isNaN(litres) ||
litres <= 0
){

alert(
"Enter a valid quantity."
);

return;

}

let chlorine =

(litres / 1000) * 4;

document.getElementById(
"resultCard"
).style.display =
"block";

document.getElementById(
"chlorineAmount"
).innerHTML =

"Recommended Chlorine: "
+
chlorine.toFixed(2)
+
" grams";

document.getElementById(
"waitingTime"
).innerHTML =

"Waiting Time: 30 Minutes";

document.getElementById(
"instructions"
).innerHTML =

`
<h5>Instructions</h5>

<ul>

<li>
Mix the chlorine thoroughly in the water.
</li>

<li>
Allow the water to stand for at least 30 minutes.
</li>

<li>
Store the water in a clean covered container.
</li>

<li>
Do not add excessive chlorine.
</li>

<li>
If water is extremely dirty, filter before chlorination.
</li>

<li>
After the waiting period, the water is generally safe to drink.
</li>

</ul>

`;

}

</script>

{% endblock %}
