
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>SDG 6 Portal</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link rel="stylesheet"
href="{{ url_for('static',
filename='css/style.css') }}">

<style>

body{
background:#f4f8fb;
}

.navbar{
padding:12px;
}

.nav-btn{
margin:4px;
border-radius:25px;
font-weight:500;
}

</style>

</head>

<body>

<nav class="navbar navbar-dark bg-primary shadow">

<div class="container-fluid">

<span class="navbar-brand fw-bold">

💧 SDG 6 Portal

</span>

</div>

</nav>

<div class="container-fluid bg-white shadow-sm p-3">

<div class="d-flex flex-wrap justify-content-center">

<a href="/"
class="btn btn-outline-primary nav-btn">
Home
</a>

<a href="/hygiene"
class="btn btn-outline-primary nav-btn">
Water Hygiene
</a>

<a href="/sanitation"
class="btn btn-outline-primary nav-btn">
Sanitation
</a>

<a href="/quality"
class="btn btn-outline-primary nav-btn">
Water Quality
</a>

<a href="/quiz"
class="btn btn-outline-success nav-btn">
Quiz Arena
</a>

<a href="/waste"
class="btn btn-outline-success nav-btn">
Waste Game
</a>

<a href="/menstrual"
class="btn btn-outline-info nav-btn">
Menstrual Hygiene
</a>

<a href="/chlorination"
class="btn btn-outline-info nav-btn">
Chlorination
</a>

<a href="/calculator"
class="btn btn-outline-warning nav-btn">
Rainwater Calculator
</a>

<a href="/water-saving"
class="btn btn-outline-warning nav-btn">
Water Saving
</a>

<a href="/dashboard"
class="btn btn-outline-danger nav-btn">
Dashboard
</a>

</div>

</div>

<div class="container mt-4">

{% block content %}
{% endblock %}

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
